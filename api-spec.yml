openapi: 3.0.0
info:
  title: User Bank Details API
  description: API for managing CRUD operations for user bank accounts.
  version: 1.1.0

paths:
  /bank-details:
    get:
      summary: Get all bank accounts for a user
      description: Returns a list of all bank accounts associated with a specific userId.
      parameters:
        - name: userId
          in: query
          required: true
          description: The ID of the user whose accounts you want to retrieve.
          schema:
            type: string
          example: "user_98765"
      responses:
        '200':
          description: A list of bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankDetailResponse'
        '400':
          description: Missing userId parameter
    post:
      summary: Create a new bank entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankDetail'
      responses:
        '201':
          description: Bank detail created successfully

  /bank-details/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a specific bank record by ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankDetailResponse'
    put:
      summary: Update bank details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankDetail'
      responses:
        '200':
          description: Updated successfully
    delete:
      summary: Remove a bank entry
      responses:
        '204':
          description: Deleted successfully

components:
  schemas:
    BankDetail:
      type: object
      required: [userId, accountName, accountNumber, bankName, IFSC_Code]
      properties:
        userId:
          type: string
        accountName:
          type: string
        accountNumber:
          type: string
        bankName:
          type: string
        IFSC_Code:
          type: string
    BankDetailResponse:
      type: object
      properties:
        id:
          type: string
          description: Internal database record ID
        userId:
          type: string
        accountName:
          type: string
        accountNumber:
          type: string
        bankName:
          type: string
        IFSC_Code:
          type: string